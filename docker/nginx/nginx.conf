server {
    listen       80;
    server_name  localhost; # 在正式環境可以改為你的 Domain 或 IP

    # 1. 處理 HTML 報告
    # 當網址是 http://localhost:8080/reports/ 時，Nginx 會去這裡找檔案
    location /reports/ {
        # alias 指向的是 Nginx 容器內部的路徑，必須與 Docker -v 掛載的容器內路徑一致
        alias /usr/share/nginx/html/reports/datadrift_report/;

        # 開啟索引功能，這樣如果你沒輸入檔名，可以看到檔案清單（測試時很有用）
        autoindex on;

        # index index.html index.htm;
        try_files $uri $uri.html =404;

        # 設定讀取權限與快取控制
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 2. 處理 OpenMetadata 的 API 與 UI
    # 除了 /reports/ 以外的所有請求，通通轉發給 OpenMetadata Server
    location / {
        # 注意：這裡的 openmetadata-server 必須是你 Docker Compose 裡的服務名稱
        proxy_pass http://openmetadata_server:8585;

        # 以下是標準的反向代理設定，確保 OpenMetadata 能拿到正確的客戶端 IP 和 Host
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 增加連線逾時限制，避免大型數據查詢時中斷
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
    }
}