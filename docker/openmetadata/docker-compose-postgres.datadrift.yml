volumes:
  ingestion-volume-reports:
  ingestion-volume-dag-airflow:
  ingestion-volume-dags:
  ingestion-volume-tmp:

services:
  ingestion:
    container_name: openmetadata_ingestion
    image: openmetadata_ingestion:1.12.9-datadrift1
    environment:
      REPORT_TIMEZONE: "Asia/Taipei"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__OPENMETADATA_AIRFLOW_APIS__DAG_GENERATED_CONFIGS: "/opt/airflow/dag_generated_configs"
      DB_HOST: ${AIRFLOW_DB_HOST:-postgresql}
      DB_PORT: ${AIRFLOW_DB_PORT:-5432}
      AIRFLOW_DB: ${AIRFLOW_DB:-airflow_db}
      DB_USER: ${AIRFLOW_DB_USER:-airflow_user}
      DB_SCHEME: ${AIRFLOW_DB_SCHEME:-postgresql+psycopg2}
      DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_pass}
    entrypoint: /bin/bash
    command:
      - "/opt/airflow/ingestion_dependency.sh"
    expose:
      - 8080
    ports:
      - "8080:8080"
    networks:
      - app_net
    volumes:
      - ingestion-volume-reports:/datadrift_report
      - ingestion-volume-dag-airflow:/opt/airflow/dag_generated_configs
      - ingestion-volume-dags:/opt/airflow/dags
      - ingestion-volume-tmp:/tmp

  nginx:
    container_name: openmetadata_nginx
    image: nginx:1.25-alpine
    restart: always
    depends_on:
      openmetadata-server:
        condition: service_healthy
    expose:
      - 80
      - 443
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app_net
    volumes:
      - ingestion-volume-reports:/usr/share/nginx/html/reports/datadrift_report:ro
      # 100% 完整繼承您的客製化安全組態與實體 SSL 密鑰證書掛載
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl/openmetadata.pem:/etc/nginx/ssl/openmetadata.pem:ro
      - ./ssl/openmetadata.key:/etc/nginx/ssl/openmetadata.key:ro

  define-test-case:
    container_name: define_test_case
    image: openmetadata_ingestion:1.12.9-datadrift1  # 同步更新至 1.12.9 以對齊測試腳本之 API
    entrypoint: []
    command: ["python", "/tmp/datadrift_definition.py"]
    environment:
      OM_ADMIN_EMAIL: "admin@open-metadata.org"
      OM_ADMIN_PWD: "admin"
    depends_on:
      openmetadata-server:
        condition: service_healthy
    networks:
      - app_net

# 網路共享宣告：指向與第一個 YAML 相同的內部專案共享橋樑，不加 external 避免死結
networks:
  app_net:
    name: openmetadata-docker_app_net
