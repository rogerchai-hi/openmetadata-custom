version: "3.9"
volumes:
  ingestion-volume-reports:

services:
  ingestion:
    image: openmetadata_ingestion:1.9.8-datadrift1
    environment:
      REPORT_TIMEZONE: "Asia/Taipei"
    volumes:
      - ingestion-volume-reports:/datadrift_report

  nginx:
    container_name: openmetadata_nginx
    image: nginx:stable-alpine
    restart: always
    depends_on:
      openmetadata-server:
        condition: service_healthy
    expose:
      - 80
      - 443
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app_net
    volumes:
      - ingestion-volume-reports:/usr/share/nginx/html/reports/datadrift_report:ro
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/ssl/openmetadata.pem:/etc/nginx/ssl/openmetadata.pem:ro
      - ../nginx/ssl/openmetadata.key:/etc/nginx/ssl/openmetadata.key:ro

  define-test-case:
    container_name: define_test_case
    image: openmetadata_ingestion:1.9.8-datadrift1
    command: "python /tmp/define_test_case.py"
    environment:
      OM_ADMIN_EMAIL: "admin@open-metadata.org"
      OM_ADMIN_PWD: "admin"
    depends_on:
      openmetadata-server:
        condition: service_healthy
    networks:
      - app_net