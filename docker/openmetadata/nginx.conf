server {
    listen       80;
    server_name  _; # 可以改為你的 Domain 或 IP

    # 1. 處理 HTML 報告
    location /reports/ {
        # 必須與 Docker -v 掛載的容器內路徑一致
        alias /usr/share/nginx/html/reports/datadrift_report/;

        autoindex on;

        try_files $uri $uri.html =404;

        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 2. 處理 OpenMetadata 的 API 與 UI
    location / {
        # openmetadata-server 必須是 Docker Compose 裡的服務名稱
        proxy_pass http://openmetadata_server:8585;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
    }
}