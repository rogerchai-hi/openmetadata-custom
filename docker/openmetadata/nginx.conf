# 隱藏 Nginx 版本號，防範資訊型掃描探測 (修補內部資訊揭露)
server_tokens off;

server {
    listen       80;
    server_name  _;
    # 強制將 HTTP 自動轉跳 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    server_name  _;

    # 憑證路徑 (保持與您的 YAML 掛載一致)
    ssl_certificate     /etc/nginx/ssl/openmetadata.pem;
    ssl_certificate_key /etc/nginx/ssl/openmetadata.key;

    # ==========================================
    # 修正點 1：安全加密套件配置 (修補加密強度不足弱點)
    # ==========================================
    # 僅允許安全的 TLS 1.2 與 TLS 1.3，徹底停用過期的 TLS 1.0 / 1.1
    ssl_protocols TLSv1.2 TLSv1.3;
    # 排除 64位元區塊加密、3DES、RC4、MD5 等弱演算法，優先採用 128位元以上現代加密
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # ==========================================
    # 修正點 2：全局安全回應標頭 (修補 Content-Type 與點擊劫持)
    # ==========================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 1. 處理 HTML 報告
    location /reports/ {
        alias /usr/share/nginx/html/reports/datadrift_report/;
        autoindex on;
        try_files $uri $uri.html =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        # 確保報告層也帶有安全標頭
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 2. 處理 OpenMetadata 的 API 與 UI
    location / {
        proxy_pass http://openmetadata_server:8585;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ==========================================
        # 修正點 3：約束 Cookie 作用域 (修補 Session Cookie 父層網域外洩)
        # ==========================================
        # 強制將所有後端發出的 Cookie 範疇，縮限在當前用戶實際連線的完整子網域，防止外洩給父網域或同父網域下的其他不安全子系統
        proxy_cookie_domain off;
        proxy_cookie_path / "/; HttpOnly; Secure";

        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
    }


}
